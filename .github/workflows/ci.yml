name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LEAN_GITHASH: 6fce8f7d5cd18a4419bca7fd51780c71c9b1cc5a

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: Julian/setup-lean@v1

      - name: Build
        run: lake build

      # Translation smoke test on the self-contained `fixtures.Test` module.
      # NB: this only *translates* (the previous CI passed a file path, not a module
      # name, and never worked). Type-*checking* the output requires the patched
      # rish987/Dedukti kernel (lazy-delta congruence + reduction sharing), which isn't
      # available here — see README ("Checking the translated output").
      - name: Test translation
        run: lake env .lake/build/bin/lean2dk fixtures.Test --no-elim
